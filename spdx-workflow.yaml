# This workflow annotates the SBOM for the SamSarette.NfpmTool with
# build tools, and generates a summary markdown.


# Workflow Parameters
parameters:
  spdx: pack/_manifest/spdx_2.2/manifest.spdx.json
  md: pack/_manifest/spdx_2.2/sbom_summary.md
  wrapper-spdx: manifest.spdx.json
  nfpm-version: 0.0.0

# Steps
steps:

  # Get the NfpmTool version
- command: get-version
  displayName: Get NfpmTool Version
  inputs:
    output: nfpmtool-version
    spdx: ${{ spdx }}
    name: SamSarette.NfpmTool


  # Rename the Root Package ID
- command: rename-id
  displayName: Rename NfpmTool Package ID
  inputs:
    spdx: ${{ spdx }}
    old: SPDXRef-RootPackage
    new: SPDXRef-SamSarette-NfpmTool-${{ nfpmtool-version }}


  # Copy DotnetToolWrapper
- command: copy-package
  inputs:
    from: ${{ wrapper-spdx }}
    to: ${{ spdx }}
    package: SPDXRef-DemaConsulting-DotnetToolWrapper
    recursive: true
    relationships:
    - type: CONTAINED_BY
      element: SPDXRef-SamSarette-NfpmTool-${{ nfpmtool-version }}
      comment: DotnetToolWrapper embedded into SamSarette.NfpmTool


  # Add nFPM Package
- command: add-package
  inputs:
    spdx: ${{ spdx }}
    package:
      id: SPDXRef-Package-nfpm-${{ nfpm-version }}
      name: nfpm
      download: NOASSERTION
      version: ${{ nfpm-version }}
      filename: NOASSERTION
      supplier: NOASSERTION
      originator: NOASSERTION
      homepage: https://nfpm.goreleaser.com/
      copyright: "Copyright (c) 2018 GoReleaser"
      summary: "nFPM is a simple, 0-dependencies, deb, rpm, apk, ipk, and arch linux packager."
      license: MIT
      purl: pkg:github/goreleaser/nfpm@v${{ nfpm-version }}
    relationships:
    - type: CONTAINED_BY
      element: SPDXRef-SamSarette-NfpmTool-${{ nfpmtool-version }}
      comment: nfpm ${{ nfpm-version }} embedded into SamSarette.NfpmTool


  # Query for DotNet version
- command: run-workflow
  displayName: Query DotNet Version
  inputs:
    url: https://raw.githubusercontent.com/demaconsulting/SpdxWorkflows/main/GetDotNetVersion.yaml
    outputs:
      version: dotnet-version


  # Add DotNet Package
- command: run-workflow
  displayName: Add DotNet Package
  inputs:
    url: https://raw.githubusercontent.com/demaconsulting/SpdxWorkflows/main/AddDotNetPackage.yaml
    parameters:
      spdx: ${{ spdx }}
      version: ${{ dotnet-version }}
      id: SPDXRef-Package-DotNet-${{ dotnet-version }}


  # Add DotNet Relationship
- command: add-relationship
  displayName: Add DotNet Relationship
  inputs:
    spdx: ${{ spdx }}
    id: SPDXRef-Package-DotNet-${{ dotnet-version }}
    relationships:
    - type: BUILD_TOOL_OF
      element: SPDXRef-SamSarette-NfpmTool-${{ nfpmtool-version }}
      comment: DotNet ${{ dotnet-version }} used to package SamSarette.NfpmTool


  # Update the SBOM sha256
- command: hash
  displayName: Update NfpmTool SBOM sha256
  inputs:
    operation: generate
    algorithm: sha256
    file: ${{ spdx }}


  # Validate the SBOM
- command: validate
  displayName: Validate NfpmTool SBOM
  inputs:
    spdx: ${{ spdx }}
    ntia: true


  # Generate the library summary
- command: to-markdown
  displayName: Generate NfpmTool SBOM summary
  inputs:
    spdx: ${{ spdx }}
    markdown: ${{ md }}
    title: NfpmTool
